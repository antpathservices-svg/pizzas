<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizza Deprizza — Reporte de ventas</title>
<style>
  :root {
    color-scheme: light;
    --page: #FFF5E6; --page-grad: linear-gradient(to right bottom, #FEFCE8 0%, #FFF7ED 50%, #FFFBEB 100%);
    --surface: #FFFFFF; --glass: rgba(255, 255, 255, .8); --ink: #2D1B00; --ink-2: #6B4F12; --muted: #8B6914;
    --grid: #FCE9CC; --base: #F2CF9A; --line: rgba(255, 140, 0, .2); --suave-bg: #FFF0CC;
    --serie: #FF8C00; --serie-wash: rgba(255, 140, 0, .12); --suave: #FFDDB0; --prom: #8B6914;
    --banda: rgba(255, 140, 0, .10); --bueno: #15803D; --malo: #D4183D; --acento: #E06C00; --primario-txt: #FFFFFF;
    --o5: #F97316; --o6: #EA580C; --o7: #C2410C;
    --h0: #FFF8EC; --h1: #FFE8C7; --h2: #FFCF8F; --h3: #FFB257; --h4: #FF8C00; --h5: #E8590C; --h6: #B23F07;
    --sombra: 0 10px 15px -3px rgba(0, 0, 0, .1), 0 4px 6px -4px rgba(0, 0, 0, .1);
    --sombra-sm: 0 4px 6px -1px rgba(0, 0, 0, .1), 0 2px 4px -2px rgba(0, 0, 0, .1);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #1A1206; --page-grad: linear-gradient(to right bottom, #1C1408 0%, #1A1106 50%, #1D1509 100%);
      --surface: #261A0A; --glass: rgba(38, 26, 10, .85); --ink: #FFF5E6; --ink-2: #F0D9B0; --muted: #D2AE62;
      --grid: #3A2A12; --base: #5A4220; --line: rgba(255, 160, 50, .22); --suave-bg: #33240E;
      --serie: #FF9E2C; --serie-wash: rgba(255, 158, 44, .16); --suave: #5C3F17; --prom: #D2AE62;
      --banda: rgba(255, 158, 44, .12); --bueno: #4ADE80; --malo: #FB7185; --acento: #FFB45C; --primario-txt: #2D1B00;
      --h0: #2B1E0C; --h1: #4A2F0C; --h2: #77450A; --h3: #A85E08; --h4: #DB7A06; --h5: #FF9E2C; --h6: #FFD08A;
      --sombra: 0 10px 15px -3px rgba(0, 0, 0, .45); --sombra-sm: 0 4px 6px -1px rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #1A1206; --page-grad: linear-gradient(to right bottom, #1C1408 0%, #1A1106 50%, #1D1509 100%);
    --surface: #261A0A; --glass: rgba(38, 26, 10, .85); --ink: #FFF5E6; --ink-2: #F0D9B0; --muted: #D2AE62;
    --grid: #3A2A12; --base: #5A4220; --line: rgba(255, 160, 50, .22); --suave-bg: #33240E;
    --serie: #FF9E2C; --serie-wash: rgba(255, 158, 44, .16); --suave: #5C3F17; --prom: #D2AE62;
    --banda: rgba(255, 158, 44, .12); --bueno: #4ADE80; --malo: #FB7185; --acento: #FFB45C; --primario-txt: #2D1B00;
    --h0: #2B1E0C; --h1: #4A2F0C; --h2: #77450A; --h3: #A85E08; --h4: #DB7A06; --h5: #FF9E2C; --h6: #FFD08A;
    --sombra: 0 10px 15px -3px rgba(0, 0, 0, .45); --sombra-sm: 0 4px 6px -1px rgba(0, 0, 0, .4);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--page); }
  body { margin: 0; min-height: 100vh; background: var(--page-grad); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--serie); outline-offset: 2px; }
  .ancho { max-width: 1536px; margin: 0 auto; }

  .barra { background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 4px solid var(--serie); box-shadow: var(--sombra); }
  .barra .ancho { display: flex; align-items: center; gap: 14px; padding: 10px 24px; }
  .logo { background: #FFFFFF; border-radius: 20px; padding: 6px 14px; box-shadow: var(--sombra-sm); display: flex; }
  .logo img { height: 40px; width: auto; display: block; }
  .marca h1 { margin: 0; font-size: 24px; font-weight: 700; color: var(--serie); line-height: 1.2; }
  .marca p { margin: 0; color: var(--muted); font-size: 15px; }
  .tema { margin-left: auto; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 6px 14px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .tema:hover { border-color: var(--serie); }

  .titulo { text-align: center; padding: 30px 24px 18px; }
  .titulo h2 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -.01em; }
  .titulo p { margin: 6px auto 0; max-width: 820px; color: var(--muted); font-size: 17px; }

  .filtros-zona { position: sticky; top: 10px; z-index: 20; padding: 0 24px; }
  .filtros { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: 16px; box-shadow: var(--sombra); }
  .filtro { display: flex; flex-direction: column; align-items: flex-start; min-width: 132px; padding: 7px 14px 8px; background: transparent; border: 0; border-radius: 14px; text-align: left; transition: background .15s; }
  .filtro:hover { background: var(--serie-wash); }
  .filtro small { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .filtro span { font-size: 14.5px; font-weight: 600; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .filtro.activo { background: var(--serie); color: var(--primario-txt); }
  .filtro.activo small { color: var(--primario-txt); opacity: .85; }
  .limpiar { margin-left: auto; background: none; border: 0; color: var(--acento); font-weight: 600; padding: 8px 12px; border-radius: 12px; }
  .limpiar:hover { background: var(--serie-wash); }

  .pop { position: fixed; z-index: 40; min-width: 250px; max-width: 340px; max-height: min(420px, 70vh); overflow: auto; background: var(--surface);
    border: 2px solid var(--line); border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, .12), 0 8px 10px -6px rgba(0, 0, 0, .1); padding: 6px; }
  .op { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 10px; background: none; text-align: left; }
  .op:hover { background: var(--serie-wash); }
  .op .chk { width: 16px; height: 16px; flex: none; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; color: var(--serie); }
  .op .caja { width: 16px; height: 16px; flex: none; border: 2px solid var(--base); border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; }
  .op[aria-checked="true"] .caja { background: var(--serie); border-color: var(--serie); }
  .op[aria-checked="true"] .caja::after { content: ""; width: 8px; height: 4px; border: solid #FFFFFF; border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }
  .op .cuenta { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .pop-sep { border-top: 1px solid var(--line); margin: 6px 0; }
  .pop-grupo { font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 10px 2px; }
  .pop-pie { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 10px 8px; font-size: 12.5px; color: var(--ink-2); }
  .pop-pie input, .pop-pie select { border: 2px solid var(--line); border-radius: 10px; padding: 4px 8px; background: var(--surface); }
  .pop-buscar { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 7px 12px; background: var(--surface); margin-bottom: 4px; }
  .pop-buscar:focus, .pop-pie input:focus, .tabla-cab input:focus { outline: none; border-color: var(--serie); }
  .btn { border: 0; background: var(--serie); color: var(--primario-txt); border-radius: 12px; padding: 7px 14px; font-weight: 600; }
  .btn:hover { filter: brightness(.95); }
  .btn.sec { background: var(--serie); color: var(--primario-txt); }

  .lectura { margin: 18px 24px 0; padding: 16px 20px; background: var(--suave-bg); border: 2px solid var(--line); border-radius: 16px; font-size: 16.5px; line-height: 1.6; color: var(--ink); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 14px; padding: 16px 24px; }
  @media (min-width: 1200px) { .kpis { grid-template-columns: 2.2fr repeat(6, minmax(0, 1fr)); } .kpis .kpi.hero { grid-column: auto; } }
  .kpi { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; transition: border-color .3s, box-shadow .3s; }
  .kpi:hover { border-color: var(--serie); box-shadow: var(--sombra); }
  .kpi .k-cab { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
  .kpi .k-ico { width: 36px; height: 36px; flex: none; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; color: #FFFFFF; }
  .kpi .k-ico svg { width: 19px; height: 19px; }
  .kpi .k-l { font-size: 13px; font-weight: 600; color: var(--muted); line-height: 1.3; }
  .kpi .k-v { font-size: 25px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; margin-top: 6px; }
  .kpi.hero { grid-column: span 2; display: grid; grid-template-columns: 1fr auto; gap: 0 16px; align-items: end; }
  .kpi.hero .k-v { font-size: 42px; line-height: 1.1; }
  .kpi .k-d { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .kpi .k-d b { font-weight: 700; }
  .kpi .k-d .sube { color: var(--bueno); } .kpi .k-d .baja { color: var(--malo); }
  .kpi.hero > .k-cab { grid-column: 1; grid-row: 1; } .kpi.hero > .k-v, .kpi.hero > .k-d { grid-column: 1 / -1; }
  .kpi .spark { grid-row: 1; grid-column: 2; align-self: start; justify-self: end; }

  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; padding: 0 24px 24px; }
  .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
  .r2 { grid-row: span 2; }
  @media (max-width: 1100px) { .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; } .r2 { grid-row: auto; } .kpi.hero { grid-column: span 2; } }
  @media (max-width: 560px) {
    .filtros { flex-wrap: nowrap; overflow-x: auto; } .filtro { flex: none; } .kpi.hero { grid-column: 1 / -1; grid-template-columns: 1fr; } .kpi .spark { grid-column: 1; grid-row: auto; justify-self: start; margin-top: 8px; }
    .barra .ancho, .filtros-zona, .kpis, .grid, .titulo { padding-left: 16px; padding-right: 16px; } .lectura { margin-left: 16px; margin-right: 16px; }
    .marca p, .tema { display: none; } .titulo h2 { font-size: 26px; }
  }

  .card { margin: 0; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 18px 20px 16px; min-width: 0; transition: border-color .3s, box-shadow .3s; }
  .card:hover { border-color: var(--serie); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .18); }
  .card-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .card-tit { font-size: 18px; font-weight: 600; color: var(--ink); }
  .card-sub { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .card-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--suave-bg); border-radius: 12px; }
  .seg button { border: 0; background: none; padding: 4px 11px; font-size: 12.5px; font-weight: 600; color: var(--muted); border-radius: 9px; }
  .seg button[aria-pressed="true"] { background: var(--serie); color: var(--primario-txt); }
  .btn-tabla { border: 2px solid var(--line); background: none; color: var(--acento); font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 10px; }
  .btn-tabla:hover, .btn-tabla[aria-pressed="true"] { border-color: var(--serie); }
  .leyenda { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-2); margin: 0 0 6px; }
  .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
  .leyenda i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; }
  .viz { position: relative; min-height: 40px; }
  .viz svg { display: block; overflow: visible; }
  .vacio { padding: 40px 0; text-align: center; color: var(--muted); }

  svg text { font-family: var(--font); }
  .ax { fill: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 12.5px; font-weight: 500; }
  .val { fill: var(--ink-2); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .val .pc { fill: var(--muted); font-weight: 400; }
  .grid-l { stroke: var(--grid); stroke-width: 1; }
  .base { stroke: var(--base); stroke-width: 1; }
  .area { fill: var(--serie-wash); }
  .linea { fill: none; stroke: var(--serie); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .linea-prom { fill: none; stroke: var(--prom); stroke-width: 1.5; stroke-linejoin: round; }
  .punto { fill: var(--serie); stroke: var(--surface); stroke-width: 2; }
  .cruz { stroke: var(--muted); stroke-width: 1; }
  .banda { fill: var(--banda); }
  .banda-temp { fill: var(--banda); stroke: var(--serie); stroke-width: 1; }
  .barra { fill: var(--serie); }
  .barra.suave { fill: var(--suave); }
  .fila { cursor: pointer; outline: none; }
  .fila:hover .barra, .fila:focus-visible .barra { opacity: .8; }
  .fila:focus-visible .lab { text-decoration: underline; }
  .celda { cursor: pointer; }
  .celda:hover, .celda:focus-visible { stroke: var(--ink); stroke-width: 1.5; outline: none; }
  .capa { cursor: crosshair; outline: none; }

  .tabla-viz { max-height: 420px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--grid); text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--surface); font-weight: 600; color: var(--muted); font-size: 12.5px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  th button { border: 0; background: none; padding: 0; font-weight: 600; color: inherit; }
  th button[data-dir]::after { content: attr(data-dir); margin-left: 4px; color: var(--serie); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--serie-wash); }
  tbody tr.sel { background: var(--serie-wash); box-shadow: inset 4px 0 0 var(--serie); }
  tfoot td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--line); }
  .tabla-cab { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
  .tabla-cab input { border: 2px solid var(--line); border-radius: 12px; padding: 7px 12px; background: var(--surface); min-width: 240px; }
  .escala { display: flex; align-items: center; gap: 2px; margin-top: 10px; font-size: 11.5px; color: var(--muted); }
  .escala i { display: inline-block; width: 22px; height: 10px; border-radius: 3px; }
  .escala span { margin: 0 6px; }

  #tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 2px solid var(--line); border-radius: 12px;
    box-shadow: var(--sombra); padding: 8px 12px; font-size: 12.5px; min-width: 150px; }
  .tip-tit { color: var(--muted); font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .tip-fila { display: flex; align-items: center; gap: 8px; line-height: 1.6; }
  .tip-fila strong { font-weight: 700; font-variant-numeric: tabular-nums; }
  .tip-fila .tip-l { color: var(--ink-2); }
  .tip-key { width: 12px; height: 0; border-top: 2px solid; display: inline-block; }

  .notas { padding: 4px 24px 40px; color: var(--ink-2); font-size: 12.5px; }
  .notas h2 { font-size: 14px; font-weight: 600; color: var(--ink); margin: 0 0 6px; }
  .notas ul { margin: 0; padding-left: 18px; max-width: 1100px; }
  .notas li { margin: 3px 0; }
  @media (prefers-reduced-motion: reduce) { .kpi, .card, .filtro { transition: none; } }
</style>
</head>

  function listaChecks(set, nombres, orden, extra) {

    frag.appendChild(opcion('Todas', set.size === 0, () => { set.clear(); actualizar(); llenarPop(); }, 'radio'));
    frag.appendChild(h('div', 'pop-sep'));
    (orden || nombres.map((_, i) => i)).forEach(i => frag.appendChild(opcion(nombres[i], set.has(i), () => { if (set.has(i)) set.delete(i); else set.add(i); actualizar(); llenarPop(); }, 'check', extra ? extra(i) : '')));
    return frag;
  }
  function llenarPop() {
    if (!popAbierto) return;
    const k = popAbierto.dataset.f, desplazamiento = pop.scrollTop;
    pop.replaceChildren();
    if (k === 'periodo') {
      PRESETS.forEach((p, i) => { if (i === 4) pop.appendChild(h('div', 'pop-sep')); pop.appendChild(opcion(p[0], F.d0 === p[1] && F.d1 === p[2], () => { F.d0 = p[1]; F.d1 = p[2]; actualizar(); cerrarPop(); }, 'radio')); });
      pop.appendChild(h('div', 'pop-sep'));
      const pie = h('div', 'pop-pie'), a = h('input'), b = h('input'), ok = h('button', 'btn', 'Aplicar');
      [a, b].forEach((inp, j) => { inp.type = 'date'; inp.min = D.dias[0]; inp.max = D.dias[ND - 1]; inp.value = D.dias[j ? F.d1 : F.d0]; inp.setAttribute('aria-label', j ? 'Hasta' : 'Desde'); });
      ok.type = 'button';
      ok.addEventListener('click', () => { const i0 = D.dias.indexOf(a.value), i1 = D.dias.indexOf(b.value); if (i0 < 0 || i1 < 0) return; F.d0 = Math.min(i0, i1); F.d1 = Math.max(i0, i1); actualizar(); cerrarPop(); });
      pie.appendChild(h('span', '', 'Rango personalizado')); pie.appendChild(a); pie.appendChild(h('span', '', 'a')); pie.appendChild(b); pie.appendChild(ok);
      pop.appendChild(pie);
    } else if (k === 'est') pop.appendChild(listaChecks(F.est, EST));
    else if (k === 'cat') pop.appendChild(listaChecks(F.cat, D.cats));
    else if (k === 'pago') pop.appendChild(listaChecks(F.pago, PAGOS));
    else if (k === 'dow') pop.appendChild(listaChecks(F.dow, DOWN));
    else if (k === 'prod') {
      const bus = h('input', 'pop-buscar'); bus.type = 'search'; bus.placeholder = 'Buscar producto'; bus.setAttribute('aria-label', 'Buscar producto'); bus.value = pop.dataset.q || '';
      pop.appendChild(bus);
      const lista = h('div'); pop.appendChild(lista);
      const pintarLista = () => {
        const q = bus.value.trim().toLowerCase(); pop.dataset.q = bus.value; lista.replaceChildren();
        lista.appendChild(opcion('Todos', F.prod.size === 0, () => { F.prod.clear(); actualizar(); llenarPop(); }, 'radio'));
        D.cats.forEach((cn, ci) => {
          const ps = D.prod.map((p, i) => i).filter(i => pCat[i] === ci && (!q || D.prod[i][1].toLowerCase().includes(q) || D.prod[i][0].includes(q)));
          if (!ps.length) return;
          lista.appendChild(h('div', 'pop-grupo', cn));
          ps.forEach(i => lista.appendChild(opcion(D.prod[i][1], F.prod.has(i), () => { if (F.prod.has(i)) F.prod.delete(i); else F.prod.add(i); actualizar(); llenarPop(); }, 'check', D.prod[i][0])));
        });
      };
      bus.addEventListener('input', pintarLista); pintarLista();
      setTimeout(() => { if (document.activeElement === document.body || !pop.contains(document.activeElement)) bus.focus(); }, 0);
    } else if (k === 'hora') {
      const pie = h('div', 'pop-pie'), a = h('select'), b = h('select');
      for (let hh = HMIN; hh <= HMAX; hh++) { a.appendChild(new Option(hora(hh), hh, false, hh === F.h0)); b.appendChild(new Option(hh + ':59', hh, false, hh === F.h1)); }
      a.setAttribute('aria-label', 'Desde'); b.setAttribute('aria-label', 'Hasta');
      const aplicar = () => { const x = +a.value, y = +b.value; F.h0 = Math.min(x, y); F.h1 = Math.max(x, y); actualizar(); };
      a.addEventListener('change', aplicar); b.addEventListener('change', aplicar);
      pop.appendChild(opcion('Todo el día', horaCompleta(), () => { F.h0 = HMIN; F.h1 = HMAX; actualizar(); llenarPop(); }, 'radio'));
      pop.appendChild(h('div', 'pop-sep'));
      pie.appendChild(h('span', '', 'De')); pie.appendChild(a); pie.appendChild(h('span', '', 'a')); pie.appendChild(b);
      pop.appendChild(pie);
    }
    pop.scrollTop = desplazamiento;
  }
  function abrirPop(btn) {
    if (popAbierto === btn) { cerrarPop(); return; }
    cerrarPop(); popAbierto = btn; btn.setAttribute('aria-expanded', 'true'); pop.dataset.q = '';
    llenarPop(); pop.hidden = false;
    const r = btn.getBoundingClientRect(), pw = pop.offsetWidth;
    pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pw - 8)) + 'px'; pop.style.top = (r.bottom + 6) + 'px';
  }
  function cerrarPop() { if (popAbierto) popAbierto.setAttribute('aria-expanded', 'false'); popAbierto = null; pop.hidden = true; }
  document.querySelectorAll('.filtro').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); abrirPop(b); }));
  pop.addEventListener('click', ev => ev.stopPropagation());
  document.addEventListener('click', cerrarPop);
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && popAbierto) { const b = popAbierto; cerrarPop(); b.focus(); } });
  addEventListener('scroll', () => { if (popAbierto) { const r = popAbierto.getBoundingClientRect(); pop.style.top = (r.bottom + 6) + 'px'; } }, { passive: true });
  $('#limpiar').addEventListener('click', () => { F.d0 = 0; F.d1 = ND - 1; F.h0 = HMIN; F.h1 = HMAX; [F.est, F.cat, F.prod, F.dow, F.pago].forEach(s => s.clear()); actualizar(); });

  /* ---------- Tema ---------- */
  const temas = ['automático', 'claro', 'oscuro'];
  let tema = 0;
  $('#tema').addEventListener('click', () => {
    tema = (tema + 1) % 3; const raiz = document.documentElement;
    if (tema === 0) raiz.removeAttribute('data-theme'); else raiz.setAttribute('data-theme', tema === 1 ? 'light' : 'dark');
    $('#tema').textContent = 'Tema: ' + temas[tema]; pintar();
  });

  /* ---------- Ciclo de actualización ---------- */
  function actualizar() {
    E = { todo: agregar('none'), fecha: agregar('fecha'), est: agregar('est'), cat: agregar('cat'), prod: agregar('prod'), pago: agregar('pago'), calor: agregar('calor'), previo: null };
    const len = F.d1 - F.d0 + 1;
    if (F.d0 - len >= 0) { E.previoRango = [F.d0 - len, F.d0 - 1]; E.previo = agregar('none', F.d0 - len, F.d0 - 1); }
    etiquetas(); pintar();
  }
  function pintar() {
    renderLectura(); renderKpis();
    const vis = { tend: renderTend, est: renderEst, pago: renderPago, cat: renderCat, top: renderTop, calor: renderCalor, hist: renderHist };
    document.querySelectorAll('[data-card]').forEach(card => {
      const k = card.dataset.card, enTabla = $('.btn-tabla', card).getAttribute('aria-pressed') === 'true';
      if (enTabla) { const t = TABLAS[k](); $('.tabla-viz', card).replaceChildren(tablaSimple(t[0], t[1])); }
      else vis[k]();
    });
    renderDetalle();
  }

  /* ---------- Textos fijos ---------- */
  $('#subtitulo').textContent = 'Pizza Deprizza, serie RBG. Cuentas cerradas del ' + rangoTxt(0, ND - 1) + ' (' + nf0.format(NC) + ' cuentas, ' + nf0.format(NL) + ' partidas).';
  [
    'Venta con IVA: lo cobrado en cada cuenta. Los descuentos aplicados a la cuenta completa (' + pesos(D.descuento) + ' en el periodo) se reparten entre sus partidas.',
    'Venta neta: venta con IVA entre 1.08; todas las partidas registran IVA de 8%.',
    'Ticket promedio: venta neta entre cuentas. Artículos por cuenta: unidades entre cuentas.',
    'Pizzas: unidades de los códigos 01 (sin pan italiano), 02 y 12. No incluye combos ni mini pizzas sin cargo.',
    'Categoría: se deduce del prefijo del código de producto, porque el archivo no trae el grupo del punto de venta.',
    'Forma de pago: se deduce de los importes de la cuenta. "Tarjeta u otra forma" incluye cualquier pago que no sea efectivo ni dólares; los dólares se convierten a tipo de cambio de 18 a 18.5. "Sin cobro" son cuentas cerradas en $0.',
    'Con filtro de producto o categoría, cuentas, ticket y artículos por cuenta consideran solo las partidas de esa selección.',
    'La comparación de los indicadores es contra el periodo inmediato anterior de la misma duración, cuando existe en los datos.',
    'Preparado por AntPath con la exportación de cuentas cerradas del punto de venta.'
  ].forEach(t => $('#notas').appendChild(h('li', '', t)));

  /* ---------- Arranque ---------- */
  let pendiente = 0, anchoPrevio = 0;
  new ResizeObserver(() => { const w = document.documentElement.clientWidth; if (w === anchoPrevio) return; anchoPrevio = w; cancelAnimationFrame(pendiente); pendiente = requestAnimationFrame(pintar); }).observe(document.body);
  actualizar();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(pintar);
})();
</script>
